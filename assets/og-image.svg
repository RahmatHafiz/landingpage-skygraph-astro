<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600&amp;family=Montserrat:wght@900&amp;display=swap');
            .bg { fill: #0B132B; }
            .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 96px; fill: #FFFFFF; letter-spacing: 0.15em; text-anchor: middle; }
            .sub-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 24px; fill: #94A3B8; letter-spacing: 0.3em; text-anchor: middle; }
            .accent { fill: #00A8E8; }
            .stroke-accent { stroke: #00A8E8; fill: none; stroke-width: 4; stroke-linecap: round; }
        </style>
        
        <filter id="blur">
            <feGaussianBlur stdDeviation="80" />
        </filter>

        <pattern id="topo" width="120" height="120" patternUnits="userSpaceOnUse">
            <path d="M0 20 C10 30, 30 10, 40 20" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.1"/>
            <path d="M40 20 C50 30, 70 10, 80 20" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.1"/>
            <path d="M80 20 C90 30, 110 10, 120 20" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.1"/>
            
            <path d="M0 80 C10 90, 30 70, 40 80" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.1"/>
            <path d="M40 80 C50 90, 70 70, 80 80" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.1"/>
            <path d="M80 80 C90 90, 110 70, 120 80" fill="none" stroke="#00A8E8" stroke-width="1.5" opacity="0.1"/>
        </pattern>
        
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0B132B;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1E2022;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background Base -->
    <rect width="1200" height="630" fill="url(#grad1)" />
    
    <!-- Topographic Pattern -->
    <rect width="1200" height="630" fill="url(#topo)" />
    
    <!-- Ambient Glow Effects -->
    <circle cx="1000" cy="0" r="500" fill="#00A8E8" opacity="0.15" filter="url(#blur)" />
    <circle cx="0" cy="630" r="400" fill="#00A8E8" opacity="0.15" filter="url(#blur)" />

    <!-- Center Content Group -->
    <g transform="translate(0, -20)">
        <!-- Quadcopter Logo -->
        <g transform="translate(500, 160)">
            <svg width="200" height="200" viewBox="0 0 100 100">
                <path d="M 46 16 C 46 36, 36 46, 16 46 A 4 4 0 0 0 16 54 C 36 54, 46 64, 46 84 A 4 4 0 0 0 54 84 C 54 64, 64 54, 84 54 A 4 4 0 0 0 84 46 C 64 46, 54 36, 54 16 A 4 4 0 0 0 46 16 Z" class="accent"/>
                <path d="M 34 26 A 16 16 0 1 1 66 26" class="stroke-accent"/>
                <path d="M 34 74 A 16 16 0 1 0 66 74" class="stroke-accent"/>
                <path d="M 26 34 A 16 16 0 1 0 26 66" class="stroke-accent"/>
                <path d="M 74 34 A 16 16 0 1 1 74 66" class="stroke-accent"/>
            </svg>
        </g>
        
        <!-- Typography -->
        <text x="615" y="450" class="logo-text">SKYGRAPH</text>
        <text x="600" y="510" class="sub-text">JASA DRONE PROFESIONAL</text>
    </g>
</svg>
